requirements: README.md
stories: stories/                 # one folder per story + README.md index
issues: issues/                   # issue reports land here

levels:                           # fastest to slowest; ATs list these in `Levels:`
  unit:
    paths: [tests/unit]
    run: echo "TODO: the command that runs tests/unit" && exit 1
  integration:
    paths: [tests/integration]
    run: echo "TODO: the command that runs tests/integration" && exit 1
  system:
    paths: [tests/system]
    run: echo "TODO: the command that runs tests/system" && exit 1

gate:
